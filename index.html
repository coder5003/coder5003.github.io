<!-- ═══════════════════ GAME VIEWER ═══════════════════ -->
<div id="game-viewer">

  <!-- FULLSCREEN IFRAME -->
  <div id="viewer-frame-wrap">

    <!-- LOADING SCREEN -->
    <div id="iframe-loading">
      <div class="il-dog">🐶</div>
      <div class="il-title" id="loading-game-name">Loading…</div>

      <div class="il-bar-wrap">
        <div class="il-bar-fill" id="il-fill"></div>
      </div>

      <div class="il-sub">Fetching game…</div>
    </div>

    <iframe
      id="viewer-iframe"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals"
      allowfullscreen>
    </iframe>

  </div>
</div>

<style>
/* ═══════════════════ FULLSCREEN GAME VIEWER ═══════════════════ */

#game-viewer{
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:999999;
  background:#000;
}

#game-viewer.open{
  display:block;
}

/* FULLSCREEN WRAP */
#viewer-frame-wrap{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* FULLSCREEN IFRAME */
#viewer-iframe{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  border:none;
  outline:none;
  background:#000;
}

/* LOADING OVERLAY */
#iframe-loading{
  position:absolute;
  inset:0;
  background:#020813;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;

  z-index:10;
  transition:opacity .4s ease;
}

#iframe-loading.hidden{
  opacity:0;
  pointer-events:none;
}

/* LOADING DOG */
.il-dog{
  font-size:3.2rem;
  animation:bob .9s ease-in-out infinite alternate;
}

@keyframes bob{
  from{transform:translateY(0)}
  to{transform:translateY(-12px)}
}

/* TITLE */
.il-title{
  font-weight:800;
  font-size:1.1rem;
  letter-spacing:.05em;
  color:#fff;
  font-family:'Exo 2',sans-serif;
}

/* LOADING BAR */
.il-bar-wrap{
  width:220px;
  height:3px;
  background:rgba(255,255,255,.07);
  border-radius:999px;
  overflow:hidden;
}

.il-bar-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#2979ff,#00b0ff);
  border-radius:999px;
  animation:barload 1.6s ease forwards;
}

@keyframes barload{
  from{width:0}
  to{width:100%}
}

/* SUBTEXT */
.il-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:.7rem;
  letter-spacing:.3em;
  color:#4a6fa5;
  text-transform:uppercase;
}
</style>

<script>
/* ═══════════════════ GAME VIEWER ═══════════════════ */

let currentUrl = '';

function openGame(url, name){

  currentUrl = url;

  const viewer  = document.getElementById('game-viewer');
  const iframe  = document.getElementById('viewer-iframe');
  const overlay = document.getElementById('iframe-loading');
  const fill    = document.getElementById('il-fill');

  viewer.classList.add('open');

  document.getElementById('loading-game-name').textContent =
    'Loading ' + name + '…';

  /* reset loading animation */
  overlay.classList.remove('hidden');

  fill.style.animation = 'none';
  void fill.offsetWidth;
  fill.style.animation = '';

  document.body.style.overflow = 'hidden';

  iframe.src = '';

  setTimeout(() => {
    iframe.src = url;
  }, 80);

  iframe.onload = () => {
    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 500);
  };
}

/* CLOSE GAME */
function closeGame(){

  document.getElementById('game-viewer')
    .classList.remove('open');

  document.getElementById('viewer-iframe').src = '';

  currentUrl = '';

  document.body.style.overflow = '';
}

/* ESC TO CLOSE */
document.addEventListener('keydown', e => {

  if(
    e.key === 'Escape' &&
    document.getElementById('game-viewer')
      .classList.contains('open')
  ){
    closeGame();
  }

});

/* DOUBLE CLICK FOR FULLSCREEN */
document.getElementById('viewer-iframe')
  .addEventListener('dblclick', () => {

    const elem =
      document.getElementById('game-viewer');

    if(!document.fullscreenElement){

      if(elem.requestFullscreen){
        elem.requestFullscreen();
      }

    } else {

      if(document.exitFullscreen){
        document.exitFullscreen();
      }

    }

});
</script>
